[package]
name = "sparring-app"
version = "0.1.0"
description = "The Sparring desktop shell"
authors = ["Sparring contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sparring_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
tauri = { version = "=2.11.5", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = { version = "=2.5.1" }
tauri-plugin-notification = { version = "=2.3.3" }
tauri-plugin-opener = { version = "=2.5.5" }
tauri-plugin-shell = { version = "=2.3.6" }

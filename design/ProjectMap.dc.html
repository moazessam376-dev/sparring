<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Inter:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #0a0f0e; color: #ece9e1;
      font-family: "Geist", ui-sans-serif, system-ui, sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased; }
    a { color: #f2b544; } a:hover { color: #ece9e1; }
    .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    .eyebrow { font-family: "Geist Mono", ui-monospace, monospace; font-size: 10px; letter-spacing: 0.16em;
      text-transform: uppercase; color: #6f7a76; }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; text-align: left; }
    .hit { cursor: pointer; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; background: #0a0f0e;">

  <div style="display: flex; align-items: center; gap: 16px; padding: 0 24px; height: 56px; border-bottom: 1px solid #1d2a26; background: #0d1513;">
    <span class="mono" style="font-size: 15px; font-weight: 600;">sparring</span>
    <span style="color: #3c4644;">/</span>
    <span style="font-weight: 500;">raptor</span>
    <span class="eyebrow">map</span>
    <div style="flex-grow: 1;"></div>
    <span class="mono" style="font-size: 11px; color: #6f7a76;">surveyed 2 days ago · 9 of 11 parts verified against the code</span>
    <button style="margin-left: 14px; padding: 5px 12px; border: 1px solid #1d2a26; border-radius: 6px; color: #a9b0ac;">Re-survey</button>
  </div>

  <div style="display: flex; flex-grow: 1; min-height: 0;">

    <div style="flex-grow: 1; position: relative; min-width: 0; padding: 8px 0 0;">
      <svg viewBox="0 0 1000 820" style="width: 100%; height: 100%;">

        <sc-for list="{{bands}}" as="b" hint-placeholder-count="5">
          <g class="hit" onClick="{{b.pick}}">
            <rect x="0" y="{{b.y}}" width="1000" height="{{b.h}}" fill="{{b.fill}}" stroke="{{b.stroke}}" stroke-width="1" stroke-dasharray="5,4"/>
            <text x="14" y="{{b.ly}}" fill="{{b.fg}}" font-size="9" font-family="Geist Mono, monospace" letter-spacing="0.14em">{{b.label}}</text>
          </g>
        </sc-for>

        <sc-for list="{{edges}}" as="e" hint-placeholder-count="12">
          <line x1="{{e.x1}}" y1="{{e.y1}}" x2="{{e.x2}}" y2="{{e.y2}}" stroke="{{e.stroke}}" stroke-width="1"/>
        </sc-for>

        <sc-for list="{{nodes}}" as="n" hint-placeholder-count="11">
          <g class="hit" onClick="{{n.pick}}">
            <rect x="{{n.x}}" y="{{n.y}}" width="{{n.w}}" height="46" rx="6" fill="{{n.fill}}" stroke="{{n.stroke}}" stroke-width="{{n.sw}}" stroke-dasharray="{{n.dash}}"/>
            <text x="{{n.cx}}" y="{{n.ty}}" text-anchor="middle" fill="{{n.fg}}" font-size="12" font-weight="500" font-family="Geist, sans-serif">{{n.name}}</text>
            <text x="{{n.cx}}" y="{{n.sy}}" text-anchor="middle" fill="{{n.sub_fg}}" font-size="9" font-family="Geist Mono, monospace">{{n.sub}}</text>
          </g>
        </sc-for>
      </svg>
    </div>

    <div style="width: 356px; border-left: 1px solid #1d2a26; background: #0d1513; padding: 26px 24px 0; display: flex; flex-direction: column; gap: 20px;">

      <div>
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px;">
          <span class="eyebrow">{{sel.kind}}</span>
          <span class="mono" style="font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; border: 1px solid {{sel.ver_border}}; color: {{sel.ver_fg}};">{{sel.verified}}</span>
        </div>
        <div style="font-size: 21px; font-weight: 600; letter-spacing: -0.01em;">{{sel.name}}</div>
        <div style="margin-top: 10px; color: #a9b0ac; line-height: 1.6;">{{sel.sentence}}</div>
      </div>

      <div style="border-top: 1px solid #1d2a26; padding-top: 18px;">
        <div class="eyebrow" style="margin-bottom: 10px;">{{sel.second_label}}</div>
        <div style="color: #a9b0ac; line-height: 1.6; font-size: 13px;">{{sel.second}}</div>
      </div>

      <div style="border: 1px solid #1d2a26; border-radius: 8px; background: #0a0f0e; padding: 14px 16px; display: flex; align-items: center; gap: 10px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6f7a76" stroke-width="1.7" stroke-linecap="round"><path d="M4 5h10l6 6v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="M14 5v6h6"/></svg>
        <span class="mono" style="font-size: 12px; color: #a9b0ac; flex-grow: 1;">{{sel.file}}</span>
        <span class="mono" style="font-size: 11px; color: #3c4644;">{{sel.commit}}</span>
      </div>

      <div>
        <div class="eyebrow" style="margin-bottom: 10px;">You have been asked about this</div>
        <div style="display: flex; align-items: baseline; gap: 10px;">
          <span class="mono" style="font-size: 26px; font-weight: 600; color: {{sel.score_fg}};">{{sel.score}}</span>
          <span style="color: #6f7a76; font-size: 12px;">{{sel.asked}}</span>
        </div>
      </div>

      <div style="flex-grow: 1;"></div>
      <div style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 24px;">
        <button onClick="{{noop}}" style="padding: 10px; border-radius: 6px; border: 1px solid #f2b544; background: rgba(242,181,68,0.12); color: #f2b544; text-align: center; font-weight: 500;">{{sel.cta}}</button>
        <button onClick="{{noop}}" style="padding: 10px; border-radius: 6px; border: 1px solid #1d2a26; color: #a9b0ac; text-align: center;">Drill just this</button>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#f2b544","options":["#f2b544","#58d68d","#eb6c36"]},"showBands":{"editor":"boolean","default":true}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'adapter', kind: 'node' };
  }
  nodes() {
    return [
      ['browser',  60,  70, 160, 'coach browser', 'socket.io-client', true],
      ['mobile',   250, 70, 150, 'athlete app',   'react native',     true],
      ['cdn',      640, 70, 150, 'video cdn',     'signed urls',      false],
      ['gateway',  150, 210, 190, 'api gateway',  'express + jwt',    true],
      ['realtime', 420, 210, 180, 'realtime hub', 'socket.io server', true],
      ['jobs',     680, 210, 170, 'worker pool',  'bullmq',           true],
      ['adapter',  420, 360, 180, 'redis adapter','pub/sub fan-out',  true],
      ['locks',    680, 360, 170, 'lock service', 'SET NX EX',        true],
      ['authz',    150, 360, 190, 'policy layer', 'rls + definer fns',true],
      ['pg',       270, 520, 200, 'postgres',     'supabase',         true],
      ['blob',     560, 520, 180, 'object store', 's3 compatible',    false],
    ];
  }
  meta() {
    return {
      browser:  ['Where a coach types. Holds no authority: every claim it makes is re-checked at the gateway.', 'Talks to', 'The gateway for reads and writes, and the realtime hub for anything live.', 'web/src/socket.ts:24', true, 0.72, 'asked 6 times'],
      mobile:   ['The athlete side. Same API, different session lifetime, and the one client that goes offline for hours.', 'Talks to', 'The gateway only. It has no realtime connection, which is why athletes see updates late.', 'app/src/api/client.ts:41', true, 0.44, 'asked 3 times'],
      cdn:      ['Serves session video through signed URLs that expire in fifteen minutes.', 'Not verified', 'The survey inferred this from configuration and could not find the code that signs the URLs. Treat it as a guess until you confirm it.', 'infra/cdn.tf:88', false, 0.0, 'never asked'],
      gateway:  ['Every request enters here. Verifies the token, resolves the tenant, and passes both down. It does not enforce the boundary.', 'Why it matters', 'Because it looks like the security layer and is not. The enforcement is one level lower, in the database.', 'server/gateway/auth.js:52', true, 0.58, 'asked 4 times'],
      realtime: ['Holds the open sockets and the room membership for one process. Everything it knows dies with that process.', 'Why it matters', 'Room membership is a set in memory. The second process you start does not share it.', 'server/realtime/hub.js:31', true, 0.66, 'asked 5 times'],
      jobs:     ['Runs video transcoding and the nightly summary. Bypasses the gateway entirely.', 'Why it matters', 'It uses the same database role but never passes through the gateway, so it is the one path where a boundary bug would not be caught by an API test.', 'workers/index.js:19', true, 0.35, 'asked 2 times'],
      adapter:  ['Publishes every room message onto a Redis channel so a second server process can deliver it to its own sockets.', 'Why it matters', 'Without it, two processes silently deliver half the traffic each. It is the single reason horizontal scaling works at all here.', 'server/realtime/adapter.js:14', true, 0.51, 'asked 4 times'],
      locks:    ['Takes a lock with set-if-absent and an expiry in one command, so a crash cannot strand it.', 'Why it matters', 'Two commands instead of one leaves a window where a dead process holds a lock forever.', 'server/locks/redis.js:22', true, 0.79, 'asked 7 times'],
      authz:    ['Row-level security policies, plus the elevated functions that deliberately bypass them.', 'Why it matters', 'This is the real tenant boundary. Every elevated function is a hole in it that has to fence itself.', 'db/policies/sessions.sql:42', true, 0.48, 'asked 5 times'],
      pg:       ['The source of truth. Every table carries a tenant column and a policy that reads it.', 'Why it matters', 'A query that runs without the tenant context does not fail. It returns everything.', 'db/schema.sql:1', true, 0.62, 'asked 4 times'],
      blob:     ['Session video and exports.', 'Not verified', 'The survey found the bucket name in configuration but no code path that writes to it. It may be unused.', 'infra/storage.tf:12', false, 0.0, 'never asked'],
    };
  }
  bandData() {
    return [
      ['tenant',  190, 230, 'TENANT BOUNDARY', 'Every read must carry the tenant. The gateway passes it, the database enforces it, and an elevated function has to fence itself by hand.', 'A missing fence returns another gym’s athletes, with a 200 and no error in any log.'],
      ['money',   500, 110, 'BILLING', 'Session counts drive invoices, so any write that creates or deletes a session is a financial event.', 'A double-write bills a gym twice and you find out from them, not from a test.'],
      ['realtime',330, 110, 'DELIVER ONCE', 'A message crosses processes through Redis exactly once, and nothing retries it.', 'A dropped publish loses the message with no error anywhere.'],
    ];
  }
  renderVals() {
    const accent = this.props.accent ?? '#f2b544';
    const showBands = this.props.showBands ?? true;
    const meta = this.meta();
    const sel = this.state.sel;
    const kind = this.state.kind;

    const pos = {};
    for (const [id, x, y, w] of this.nodes()) pos[id] = { x: x + w / 2, y: y + 23 };

    const bands = !showBands ? [] : this.bandData().map(([id, y, h, label]) => {
      const on = kind === 'band' && sel === id;
      return { y, h, label, ly: y + 16, pick: () => this.setState({ sel: id, kind: 'band' }),
        fill: on ? 'rgba(242,181,68,0.07)' : 'rgba(169,176,172,0.02)',
        stroke: on ? accent : '#1d2a26',
        fg: on ? accent : '#3c4644' };
    });

    const edgeList = [['browser','gateway'],['mobile','gateway'],['browser','realtime'],['gateway','authz'],['gateway','realtime'],['realtime','adapter'],['jobs','locks'],['adapter','locks'],['authz','pg'],['jobs','pg'],['jobs','blob'],['cdn','blob'],['adapter','realtime']];
    const edges = edgeList.map(([a, b]) => ({
      x1: pos[a].x, y1: pos[a].y, x2: pos[b].x, y2: pos[b].y,
      stroke: (kind === 'node' && (sel === a || sel === b)) ? 'rgba(242,181,68,0.5)' : '#18231f',
    }));

    const nodes = this.nodes().map(([id, x, y, w, name, sub, verified]) => {
      const on = kind === 'node' && sel === id;
      return { id, x, y, w, name, sub, cx: x + w / 2, ty: y + 21, sy: y + 36,
        pick: () => this.setState({ sel: id, kind: 'node' }),
        fill: on ? 'rgba(242,181,68,0.10)' : '#0d1513',
        stroke: on ? accent : (verified ? '#1d2a26' : '#3c3326'),
        sw: on ? 1.6 : 1,
        dash: verified ? '0' : '4,3',
        fg: on ? '#ece9e1' : (verified ? '#ece9e1' : '#a9b0ac'),
        sub_fg: verified ? '#6f7a76' : '#8a7a4d' };
    });

    let panel;
    if (kind === 'band') {
      const [, , , label, rule, cost] = this.bandData().find((b) => b[0] === sel);
      panel = { kind: 'Constraint', name: label.toLowerCase(), sentence: rule,
        second_label: 'What forgetting it costs', second: cost,
        verified: 'verified', ver_fg: '#58d68d', ver_border: 'rgba(88,214,141,0.4)',
        file: 'db/policies/sessions.sql:42', commit: '@a3f91c2',
        score: '48%', score_fg: '#ef5a5a', asked: 'across 5 questions', cta: 'Teach me this constraint' };
    } else {
      const [sentence, label2, second, file, verified, score, asked] = meta[sel];
      const pct = Math.round(score * 100);
      panel = { kind: 'Part of the map', name: this.nodes().find((n) => n[0] === sel)[4],
        sentence, second_label: label2, second, file, commit: '@a3f91c2',
        verified: verified ? 'verified' : 'inferred',
        ver_fg: verified ? '#58d68d' : '#f2b544',
        ver_border: verified ? 'rgba(88,214,141,0.4)' : 'rgba(242,181,68,0.45)',
        score: score === 0 ? '—' : `${pct}%`,
        score_fg: score === 0 ? '#3c4644' : (score < 0.6 ? '#ef5a5a' : (score > 0.75 ? '#58d68d' : accent)),
        asked, cta: score === 0 ? 'Write a lesson on this' : 'Open the lesson' };
    }

    return { nodes, edges, bands, sel: panel, noop: () => {} };
  }
}
</script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #e2e5e4; font-family: "Archivo", system-ui, sans-serif; font-size: 13px; -webkit-font-smoothing: antialiased; }
    a { color: #9ee87d; } a:hover { color: #e2e5e4; }
    .m { font-family: "DM Mono", ui-monospace, monospace; font-weight: 300; }
    .lbl { font-family: "DM Mono", monospace; font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: #626a69; }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; text-align: left; }
    input, textarea { font: inherit; color: #e2e5e4; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 8px; padding: 11px 13px; width: 100%; outline: none; resize: none; }
    input:focus, textarea:focus { border-color: rgba(158,232,125,0.45); background: rgba(158,232,125,0.04); }
    input::placeholder, textarea::placeholder { color: #4a5150; }
    .glass { background: rgba(24,26,27,0.58); backdrop-filter: blur(32px) saturate(135%); -webkit-backdrop-filter: blur(32px) saturate(135%); }
    .glass-content { background: rgba(21,23,24,0.86); backdrop-filter: blur(44px) saturate(118%); -webkit-backdrop-filter: blur(44px) saturate(118%); }
    .hair { box-shadow: inset 0 1px 0 rgba(255,255,255,0.07); }
    .panel { background: rgba(255,255,255,0.028); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.05); }
    .rail { border-right: 1px solid rgba(255,255,255,0.07); box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 14px 0 38px rgba(0,0,0,0.24); }
    .pill { border-radius: 7px; padding: 5px 11px; font-size: 12px; }
    .go { background: rgba(158,232,125,0.13); border: 1px solid rgba(158,232,125,0.34); color: #9ee87d; }
    .ghost { border: 1px solid rgba(255,255,255,0.09); color: #979e9d; }
    @keyframes drift { 0% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(-2.5%,1.5%,0) scale(1.06); } 100% { transform: translate3d(0,0,0) scale(1); } }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    .ground { animation: drift 54s ease-in-out infinite; }
    .rise { animation: rise 420ms cubic-bezier(0.22,1,0.36,1) both; }
    @media (prefers-reduced-motion: reduce) { .ground, .rise { animation: none; } }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #0b0c0c;">
  <div class="ground" style="position: absolute; inset: -8%; background:
      radial-gradient(880px 620px at 12% 4%, rgba(158,232,125,0.13), transparent 62%),
      radial-gradient(820px 600px at 82% 10%, rgba(150,168,172,0.15), transparent 60%),
      radial-gradient(760px 720px at 58% 104%, rgba(120,140,128,0.11), transparent 64%),
      radial-gradient(520px 420px at 96% 78%, rgba(158,232,125,0.07), transparent 60%);"></div>
  <div style="position: absolute; inset: 0; opacity: 0.038; background-image: radial-gradient(#ffffff 0.5px, transparent 0.5px); background-size: 3px 3px;"></div>
  <div style="position: relative; height: 100%; display: flex;">
    <div class="glass rail" style="width: 250px; flex-shrink: 0; display: flex; flex-direction: column; padding: 18px 0;">
      <div style="display: flex; align-items: center; gap: 9px; padding: 0 16px 18px;">
        <span style="width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(150deg, #9ee87d, #4e8f5e); box-shadow: 0 0 20px rgba(158,232,125,0.34), inset 0 1px 0 rgba(255,255,255,0.35); flex-shrink: 0;"></span>
        <span style="font-size: 14px; font-weight: 600; letter-spacing: -0.01em;">sparring</span>
        <div style="flex-grow: 1;"></div>
        <span class="m" style="font-size: 10px; color: #9ee87d;">{{dueCount}}</span>
      </div>
      <div class="lbl" style="padding: 0 16px 7px;">Projects</div>
      <sc-for list="{{projects}}" as="p" hint-placeholder-count="4">
        <button onClick="{{p.pick}}" style="display: flex; align-items: center; gap: 10px; margin: 0 8px; padding: 7px 9px; border-radius: 7px; background: {{p.bg}}; width: calc(100% - 16px);">
          <span style="width: 5px; height: 5px; border-radius: 50%; background: {{p.dot}}; flex-shrink: 0;"></span>
          <span style="flex-grow: 1; color: {{p.fg}}; font-size: 13px;">{{p.name}}</span>
          <span class="m" style="font-size: 10px; color: #626a69;">{{p.due}}</span>
        </button>
      </sc-for>
      <button onClick="{{noop}}" style="display: flex; align-items: center; gap: 8px; margin: 8px 8px 0; padding: 7px 9px; border-radius: 7px; width: calc(100% - 16px); color: #626a69; font-size: 12.5px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#626a69" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Survey a repository
      </button>

      <div class="lbl" style="padding: 22px 16px 8px;">Due now</div>
      <sc-for list="{{queue}}" as="q" hint-placeholder-count="4">
        <button onClick="{{noop}}" style="display: flex; align-items: center; gap: 9px; padding: 5px 16px; width: 100%;">
          <span style="width: 3px; height: 13px; border-radius: 2px; background: {{q.bar}}; flex-shrink: 0;"></span>
          <span style="flex-grow: 1; font-size: 12.5px; color: #979e9d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{q.name}}</span>
        </button>
      </sc-for>
      <div style="flex-grow: 1;"></div>
      <button onClick="{{noop}}" class="pill go" style="margin: 0 12px; text-align: center;">Start drill</button>
    </div>

    <div class="glass-content" style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;">
      <div class="glass hair" style="height: 46px; flex-shrink: 0; display: flex; align-items: center; padding: 0 18px; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.06);">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
          <button onClick="{{f.pick}}" class="m" style="font-size: 10.5px; padding: 4px 11px; border-radius: 6px; background: {{f.bg}}; color: {{f.fg}}; border: 1px solid {{f.br}};">{{f.label}}</button>
        </sc-for>
        <div style="flex-grow: 1;"></div>
        <span class="lbl">{{shown}}</span>
      </div>

      <div style="flex-grow: 1; display: flex; min-height: 0;">
        <div style="flex-grow: 1; min-width: 0; position: relative;">
          <svg viewBox="0 0 820 760" style="width: 100%; height: 100%;">
            <sc-for list="{{edges}}" as="e" hint-placeholder-count="10">
              <line x1="{{e.x1}}" y1="{{e.y1}}" x2="{{e.x2}}" y2="{{e.y2}}" stroke="{{e.stroke}}" stroke-width="{{e.w}}"/>
            </sc-for>
            <sc-for list="{{nodes}}" as="n" hint-placeholder-count="9">
              <g onClick="{{n.pick}}" style="cursor: pointer;">
                <circle cx="{{n.x}}" cy="{{n.y}}" r="{{n.glow}}" fill="{{n.glowFill}}"/>
                <circle cx="{{n.x}}" cy="{{n.y}}" r="{{n.r}}" fill="{{n.fill}}" stroke="{{n.stroke}}" stroke-width="{{n.sw}}"/>
                <circle cx="{{n.x}}" cy="{{n.y}}" r="{{n.inner}}" fill="{{n.bar}}"/>
                <text x="{{n.x}}" y="{{n.ty}}" text-anchor="middle" fill="{{n.tfill}}" font-size="{{n.ts}}" font-family="Archivo, sans-serif" font-weight="500">{{n.name}}</text>
              </g>
            </sc-for>
          </svg>
        </div>

        <div style="width: 322px; flex-shrink: 0; border-left: 1px solid rgba(255,255,255,0.06); padding: 24px 22px 0; display: flex; flex-direction: column; gap: 20px;">
          <div class="rise">
            <div class="lbl" style="margin-bottom: 9px;">{{sel.kind}}</div>
            <div style="font-size: 20px; font-weight: 600; letter-spacing: -0.014em;">{{sel.name}}</div>
            <div style="margin-top: 9px; color: #979e9d; line-height: 1.6;">{{sel.blurb}}</div>
          </div>
          <div class="panel" style="padding: 15px 16px;">
            <div style="display: flex; align-items: baseline; gap: 8px;">
              <span class="m" style="font-size: 26px; color: {{sel.fg}};">{{sel.score}}</span>
              <span class="lbl" style="letter-spacing: 0.06em;">held</span>
              <div style="flex-grow: 1;"></div>
              <span class="m" style="font-size: 10px; color: #626a69;">{{sel.n}}</span>
            </div>
            <div style="margin-top: 11px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.06); position: relative;">
              <span style="position: absolute; left: {{sel.lo}}; width: {{sel.span}}; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.15); display: block;"></span>
              <span style="position: absolute; left: 0; width: {{sel.bar}}; height: 3px; border-radius: 2px; background: {{sel.fg}}; display: block;"></span>
            </div>
            <div class="m" style="margin-top: 9px; font-size: 10.5px; color: #565d5c; line-height: 1.5;">{{sel.caveat}}</div>
          </div>
          <div>
            <div class="lbl" style="margin-bottom: 10px;">Weakest here</div>
            <sc-for list="{{sel.weak}}" as="w" hint-placeholder-count="3">
              <div style="display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid rgba(255,255,255,0.05);">
                <span style="width: 4px; height: 4px; border-radius: 50%; background: #e88d7d;"></span>
                <span style="flex-grow: 1; font-size: 12.5px;">{{w.name}}</span>
                <span class="m" style="font-size: 10px; color: #626a69;">{{w.last}}</span>
              </div>
            </sc-for>
          </div>
          <div style="flex-grow: 1;"></div>
          <div style="display: flex; gap: 8px; padding-bottom: 22px;">
            <button onClick="{{noop}}" class="pill go" style="flex-grow: 1; text-align: center;">Drill this</button>
            <button onClick="{{noop}}" class="pill ghost" style="flex-grow: 1; text-align: center;">Open map</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#9ee87d","options":["#9ee87d","#7dd3e8","#e8c97d"]}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 'socketio', filter: 'all', project: 'raptor' }; }
  meta() {
    return {
      raptor:   ['Project', 'raptor', 'Real-time coaching platform. Socket.io over Redis, Supabase behind row-level security.', 0.61, 31, [['Ack timeouts','14d'],['Adapter fan-out','21d']]],
      socketio: ['Topic', 'socket.io', 'How rooms, acknowledgements and the Redis adapter move a message between two browsers.', 0.74, 9, [['Ack timeouts','14d'],['Reconnection backoff','9d'],['Namespace vs room','31d']]],
      redis:    ['Topic', 'redis', 'Locking, expiry and the pub/sub channel the socket adapter rides on.', 0.81, 12, [['SET NX EX','19d']]],
      rls:      ['Topic', 'row-level security', 'Where the tenant boundary is enforced, and where it is only passed along.', 0.55, 7, [['Definer functions','6d'],['Policy vs handler','12d']]],
      acks:     ['Subtopic', 'acknowledgements', 'The callback the sender passes and the server invokes. Silent when the socket drops.', 0.38, 3, [['Ack timeouts','14d']]],
      recon:    ['Subtopic', 'reconnection', 'What the client retries, and what it quietly gives up on.', 0.52, 4, [['Backoff window','9d']]],
      setnx:    ['Subtopic', 'SET NX EX', 'One command because two leave a window where a crash strands the lock.', 0.79, 6, [['Token check','19d']]],
      definer:  ['Subtopic', 'definer functions', 'Elevated functions that must fence themselves, because policies do not apply inside.', 0.44, 5, [['Caller check','6d']]],
      policy:   ['Subtopic', 'policy vs handler', 'Which of the two is the enforcement point, and which only carries context.', 0.58, 4, [['Enforcement point','12d']]],
    };
  }
  layout() {
    return [['raptor',410,140,32,'p'],['socketio',236,318,25,'t'],['redis',572,306,25,'t'],['rls',410,496,25,'t'],
      ['acks',128,452,17,'s'],['recon',288,486,17,'s'],['setnx',668,444,17,'s'],['definer',310,636,17,'s'],['policy',516,640,17,'s']];
  }
  renderVals() {
    const accent = this.props.accent ?? '#9ee87d';
    const meta = this.meta();
    const gaps = this.state.filter === 'gaps';
    const pos = {}; for (const [id,x,y] of this.layout()) pos[id] = {x,y};
    const el = [['raptor','socketio'],['raptor','redis'],['raptor','rls'],['socketio','acks'],['socketio','recon'],['redis','setnx'],['rls','definer'],['rls','policy'],['socketio','redis']];
    const tone = (s) => s < 0.6 ? '#e88d7d' : (s > 0.75 ? accent : '#e8c97d');

    const edges = el.map(([a,b]) => {
      const on = this.state.sel === a || this.state.sel === b;
      return { x1: pos[a].x, y1: pos[a].y, x2: pos[b].x, y2: pos[b].y,
        stroke: on ? 'rgba(158,232,125,0.42)' : 'rgba(255,255,255,0.07)', w: on ? 1.4 : 1 };
    });
    const nodes = this.layout().map(([id,x,y,r,k]) => {
      const s = meta[id][3]; const on = this.state.sel === id; const dim = gaps && s >= 0.6;
      return { x, y, r, name: meta[id][1], inner: Math.max(3, r*s*0.66), bar: tone(s),
        glow: on ? r + 13 : 0, glowFill: on ? 'rgba(158,232,125,0.09)' : 'transparent',
        fill: on ? 'rgba(158,232,125,0.09)' : 'rgba(255,255,255,0.03)',
        stroke: on ? accent : (dim ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.10)'),
        sw: on ? 1.5 : 1, ts: k === 'p' ? 13 : (k === 't' ? 12 : 11), ty: y + r + 17,
        tfill: dim ? '#3a413f' : (on ? '#e2e5e4' : '#979e9d'),
        pick: () => this.setState({ sel: id }) };
    });
    const chip = (id, label) => { const on = this.state.filter === id;
      return { label, pick: () => this.setState({ filter: id }),
        bg: on ? 'rgba(158,232,125,0.13)' : 'transparent', fg: on ? accent : '#979e9d',
        br: on ? 'rgba(158,232,125,0.34)' : 'rgba(255,255,255,0.07)' }; };

    const [kind, name, blurb, score, n, weak] = meta[this.state.sel];
    const pct = Math.round(score*100); const width = Math.max(8, Math.round(64/Math.sqrt(n+1)));
    const lo = Math.max(0, pct - Math.round(width/2));
    return {
      nodes, edges, noop: () => {}, dueCount: '18',
      shown: gaps ? '5 of 8 topics, the weak ones' : '8 topics across 1 project',
      filters: [chip('all','Everything'), chip('gaps','Gaps only'), chip('due','Due today')],
      projects: [['raptor','12','raptor'],['openreach-tools','4','redis'],['sparring','2','rls'],['portfolio','0','socketio']]
        .map(([nm,due,target]) => { const on = this.state.project === nm;
          return { name: nm, due, pick: () => this.setState({ project: nm, sel: target }),
            bg: on ? 'rgba(255,255,255,0.055)' : 'transparent', fg: on ? '#e2e5e4' : '#979e9d',
            dot: on ? accent : 'rgba(255,255,255,0.14)' }; }),
      queue: [['acknowledgements','#e88d7d'],['definer functions','#e88d7d'],['redis adapter','#e8c97d'],['room membership','rgba(255,255,255,0.14)']]
        .map(([nm,bar]) => ({ name: nm, bar })),
      sel: { kind, name, blurb, score: pct + '%', fg: tone(score), n: n + ' answers',
        bar: pct + '%', lo: lo + '%', span: Math.min(width, 100-lo) + '%',
        caveat: 'the pale band is how wrong this could be',
        weak: weak.map(([nm,last]) => ({ name: nm, last: last + ' ago' })) },
    };
  }
}
</script>
</body>
</html>

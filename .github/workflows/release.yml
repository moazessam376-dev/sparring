name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            bundles: app,dmg
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x86_64
            bundles: app,dmg
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            bundles: appimage,deb
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            bundles: nsis

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Tauri 2's current prerequisites list plus its documented packaging helpers.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install application dependencies
        working-directory: app
        run: npm ci

      - name: Build release bundles
        working-directory: app
        shell: bash
        run: npm run tauri build -- --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"

      - name: Normalize release artifact names
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          bundle_dir="app/src-tauri/target/${TARGET}/release/bundle"
          mkdir -p release

          first_file() {
            find "$1" -type f -name "$2" -print -quit
          }

          require_path() {
            if [ -z "$1" ] || [ ! -e "$1" ]; then
              echo "Expected bundle was not produced: $2" >&2
              exit 1
            fi
          }

          case "$PLATFORM" in
            macos-arm64|macos-x86_64)
              app_bundle=$(find "$bundle_dir/macos" -type d -name '*.app' -print -quit)
              dmg=$(first_file "$bundle_dir/dmg" '*.dmg')
              require_path "$app_bundle" "$PLATFORM app bundle"
              require_path "$dmg" "$PLATFORM disk image"
              tar -czf "release/Sparring-${PLATFORM}.app.tar.gz" -C "$(dirname "$app_bundle")" "$(basename "$app_bundle")"
              cp "$dmg" "release/Sparring-${PLATFORM}.dmg"
              ;;
            windows-x86_64)
              installer=$(first_file "$bundle_dir/nsis" '*-setup.exe')
              require_path "$installer" "Windows installer"
              cp "$installer" release/Sparring-windows-x86_64.exe
              ;;
            linux-x86_64)
              appimage=$(first_file "$bundle_dir/appimage" '*.AppImage')
              deb=$(first_file "$bundle_dir/deb" '*.deb')
              require_path "$appimage" "Linux AppImage"
              require_path "$deb" "Linux Debian package"
              cp "$appimage" release/Sparring-linux-x86_64.AppImage
              cp "$deb" release/Sparring-linux-x86_64.deb
              ;;
            *)
              echo "Unknown release platform: $PLATFORM" >&2
              exit 1
              ;;
          esac

          ls -l release

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create SHA-256 checksums
        working-directory: release
        run: sha256sum -- * > SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
